<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ChronoCampus - Change Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h2>Change Password</h2>

        <form id="changePasswordForm">

            <input type="email" id="cp_email" placeholder="Email" required>

            <input type="password" id="old_password" placeholder="Current Password" required>

            <input type="password" id="new_password" placeholder="New Password" required>

            <button type="submit">Change Password</button>

        </form>

        <p id="changePasswordMessage"></p>

        <p class="link">
            <a href="/login">Back to Login</a>
        </p>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
